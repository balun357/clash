on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source list
        run: |
          curl -fsSL "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt" -o source.txt
          curl -fsSL "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" -o ru_cidr.txt

      - name: Convert subscription
        run: |
          pip install -q pyyaml
          cat > convert.py <<'PY'
          import base64
          import json
          import ipaddress
          import yaml
          from urllib.parse import urlsplit, parse_qs, unquote

          nodes = []
          used_names = set()

          def decode64(value):
              value += "=" * (-len(value) % 4)
              return base64.urlsafe_b64decode(value).decode("utf-8")

          def query_value(q, key, default=""):
              return q.get(key, [default])[0]

          def add_node(node):
              name = node.get("name") or f"Proxy-{len(nodes)+1}"
              base = name
              number = 2
              while name in used_names:
                  name = f"{base}-{number}"
                  number += 1
              node["name"] = name
              used_names.add(name)
              nodes.append(node)

          def add_transport(node, q, network):
              if network == "raw":
                  network = "tcp"
              node["network"] = network

              host = query_value(q, "host")
              path = unquote(query_value(q, "path", "/"))

              if network == "ws":
                  opts = {"path": path}
                  if host:
                      opts["headers"] = {"Host": host}
                  node["ws-opts"] = opts

              elif network == "grpc":
                  service = query_value(q, "serviceName") or path.lstrip("/")
                  node["grpc-opts"] = {
                      "grpc-service-name": service
                  }

              elif network == "xhttp":
                  opts = {"path": path}
                  if host:
                      opts["headers"] = {"Host": host}
                  mode = query_value(q, "mode")
                  if mode:
                      opts["mode"] = mode
                  node["xhttp-opts"] = opts

          for line in open("source.txt", encoding="utf-8"):
              line = line.strip()
              if not line or "://" not in line:
                  continue

              try:
